<div [formGroup]="fieldGroup" class="flex flex-col bg-white border border-slate-200 rounded-3xl shadow-sm hover:shadow-md transition-all overflow-hidden h-full">

  <div class="h-48 bg-slate-100 flex items-center justify-center border-b border-slate-50 overflow-hidden">
    <span class="material-icons text-slate-300 text-5xl">image</span>
  </div>

  <div class="p-6 flex flex-col flex-1">
    <input formControlName="name"
           class="text-xl font-bold text-slate-800 bg-transparent border-none focus:ring-0 w-full mb-1 p-0"
           placeholder="Field Name">

    <textarea formControlName="description"
              class="text-slate-500 text-sm bg-transparent border-none focus:ring-0 w-full resize-none flex-1 p-0 leading-relaxed"
              placeholder="Add a description..."></textarea>
  </div>

  <div class="px-6 py-4 bg-slate-50/50 flex justify-end items-center border-t border-slate-100">
    <button (click)="saveClicked.emit(fieldGroup.getRawValue())"
            [disabled]="fieldGroup.invalid || fieldGroup.pristine"
            class="text-sm font-bold text-indigo-600 disabled:text-slate-300 uppercase tracking-wider transition-colors">
      Save Changes
    </button>
  </div>
</div>
