<form [formGroup]="searchForm"
      class="flex items-center gap-3 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm mb-8">

  <div class="relative flex-1 group">
    <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">
      search
    </span>
    <input data-cy="query-input"
      formControlName="query"
      (keyup.enter)="onSearch()"
      placeholder="Search fields of study..."
      class="w-full pl-10 pr-4 py-2 bg-transparent outline-none text-slate-700 placeholder:text-slate-400"
    />
  </div>

  <div class="h-6 w-[1px] bg-slate-200"></div>

  <div class="flex items-center gap-1">
    <select data-cy="sortBy-select" formControlName="sortBy"
            class="bg-transparent text-sm font-medium text-slate-600 outline-none cursor-pointer hover:text-indigo-600 transition-colors">
      <option value="name">Name</option>
      <option value="recent">Date</option>
    </select>

    <button data-cy="sortDir-btn" type="button" (click)="toggleSortDirection()"
            class="p-1.5 hover:bg-slate-100 rounded-lg cursor-pointer text-slate-500 transition-all">
      <span class="material-icons text-lg">
        {{ searchForm.get('sortDir')?.value === 'asc' ? 'north' : 'south' }}
      </span>
    </button>
  </div>

  <button data-cy="search-btn" type="button" (click)="onSearch()"
          class="flex items-center justify-center w-10 h-10 bg-indigo-600 cursor-pointer text-white rounded-xl hover:bg-indigo-700 hover:shadow-lg transition-all">
    <span class="material-icons">search</span>
  </button>

  <button data-cy="add-btn" type="button" (click)="addClicked.emit()"
          class="flex items-center justify-center w-10 h-10 bg-emerald-500 cursor-pointer text-white rounded-xl hover:bg-emerald-600 hover:shadow-lg transition-all">
    <span class="material-icons">add</span>
  </button>
</form>
