
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8081
spring.application.name=tutorials.editor

# ===============================
# SPRING DATASOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5434/tutorial_edition
spring.datasource.username=app_user
spring.datasource.password=app!admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===============================
#      FLYWAY CONFIGURATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Location of migration files
spring.flyway.locations=classpath:db
spring.flyway.url=${spring.datasource.url}
spring.flyway.driver-class-name=${spring.datasource.driver-class-name}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# ===============================
# KEYCLOAK / OAUTH2 CONFIGURATION
# ===============================
# The Issuer URI is used to verify the "iss" claim in the JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/tuto-editor

# The JWK Set URI allows Spring to download Keycloak's public keys
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/tuto-editor/protocol/openid-connect/certs

# ===============================
# LOGGING (Crucial for Debugging)
# ===============================
# Shows exactly why a token was rejected (expired, wrong issuer, etc.)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
# Optional: Format the logs to be more readable
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# SWAGGER / OPENAPI CONFIG
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# This allows Swagger to automatically fill the Client ID in the login popup
springdoc.swagger-ui.oauth.client-id=tuto-editor-backend
